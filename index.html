<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nina Decor</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nina Decor">
  <meta name="theme-color" content="#0f172a">

  <!-- Manifest PWA para Instalação no Android/iOS -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Nina%20Decor%22,%22short_name%22:%22Nina%20Decor%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f172a%22,%22theme_color%22:%22%230f172a%22,%22icons%22:[{%22src%22:%22https://img.icons8.com/color/192/armchair.png%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22}]}">

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #d97706;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 100px; }

    header {
      position: sticky; top: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100; padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .logo { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }
    .brand h1 { font-size: 1.15rem; font-weight: 700; }

    .search { width: 100%; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.95rem; outline: none; margin-bottom: 10px; }

    .tabs { display: flex; gap: 8px; }
    .tab { padding: 6px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .container { padding: 16px; }
    .group-title { font-size: 0.8rem; text-transform: uppercase; color: var(--accent); margin: 16px 0 8px 2px; font-weight: 700; letter-spacing: 0.05em; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .card-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .info { flex: 1; }
    .title { font-size: 0.92rem; font-weight: 600; margin-bottom: 4px; }
    .spec { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
    .price-box { text-align: right; white-space: nowrap; }
    .price-orig { font-size: 0.8rem; color: var(--muted); text-decoration: line-through; display: none; }
    .price-final { font-size: 1.05rem; font-weight: 700; color: #38bdf8; }

    .controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 4px; }
    .disc-group { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
    .disc-input { width: 50px; padding: 4px 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-weight: 600; font-size: 0.85rem; text-align: center; outline: none; }
    .disc-input:focus { border-color: var(--accent); }

    .btn-clear {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .btn-clear:active { transform: scale(0.95); }

    .btn-add { background: rgba(217, 119, 6, 0.2); color: var(--accent); border: 1px solid var(--accent); padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-add.active { background: var(--accent); color: #fff; }

    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .total-val { font-size: 1.15rem; font-weight: 700; color: var(--green); }
    .total-cnt { font-size: 0.75rem; color: var(--muted); }

    .btn-wa { background: var(--green); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">N</div>
      <h1>Nina Decor</h1>
    </div>
    <input type="text" id="src" class="search" placeholder="Buscar produto, tecido, modelo..." oninput="render()">
    <div class="tabs">
      <button class="tab active" onclick="setCat('all', this)">Todos</button>
      <button class="tab" onclick="setCat('cad', this)">Cadeiras</button>
      <button class="tab" onclick="setCat('mes', this)">Mesas</button>
    </div>
  </header>

  <div class="container" id="app"></div>

  <div class="footer">
    <div>
      <div class="total-cnt" id="cnt">0 itens selecionados</div>
      <div class="total-val" id="tot">R$ 0,00</div>
    </div>
    <button class="btn-wa" onclick="send()">Enviar WhatsApp</button>
  </div>

  <script>
    var items = [
      { c: 'cad', g: 'Cadeira Cascata', t: 'Cadeira Cascata New - Linho', s: 'Corpo: Mel / Tecido: Linho / Encosto: Laminado Cor Mel', p: 346.19 },
      { c: 'cad', g: 'Cadeira Cascata', t: 'Cadeira Cascata New - Boucle ou Corino', s: 'Corpo: Mel / Tecido: Boucle ou Corino / Encosto: Laminado Cor Mel', p: 369.49 },
      { c: 'cad', g: 'Cadeira Milano', t: 'Cadeira Milano - Linho', s: 'Corpo: Mel / Tecido: Linho / Encosto: Ratam', p: 346.19 },
      { c: 'cad', g: 'Cadeira Milano', t: 'Cadeira Milano - Boucle ou Corino', s: 'Corpo: Mel / Tecido: Boucle ou Corino / Encosto: Ratam', p: 369.49 },
      { c: 'cad', g: 'Cadeira New Luxury', t: 'Cadeira Luxury New - Linho', s: 'Corpo: Mel / Tecido: Linho / Encosto: Linho', p: 368.50 },
      { c: 'cad', g: 'Cadeira New Luxury', t: 'Cadeira Luxury New - Boucle ou Corino', s: 'Corpo: Mel / Tecido: Boucle ou Corino / Encosto: Boucle ou Corino', p: 391.42 },
      { c: 'cad', g: 'Cadeira Cora', t: 'Cadeira Cora - Linho', s: 'Corpo: Mel / Tecido Linho / Encosto: Ratam', p: 248.51 },
      { c: 'cad', g: 'Cadeira Cora', t: 'Cadeira Cora - Boucle ou Corino', s: 'Corpo: Mel / Tecido Boucle ou Corino / Encosto: Ratam', p: 259.77 },
      { c: 'cad', g: 'Cadeira Boreal', t: 'Cadeira Boreal - Linho', s: 'Corpo: Mel / Tecido: Linho / Encosto: Laminado Cor Mel', p: 268.00 },
      { c: 'cad', g: 'Cadeira Boreal', t: 'Cadeira Boreal - Boucle ou Corino', s: 'Corpo: Mel / Tecido: Boucle ou Corino / Encosto: Laminado Cor Mel', p: 279.27 },
      { c: 'cad', g: 'Cadeira Star', t: 'Cadeira Star - Linho', s: 'Corpo: Mel / Tecido: Linho / Encosto: Laminado Cor Mel', p: 267.96 },
      { c: 'cad', g: 'Cadeira Star', t: 'Cadeira Star - Boucle ou Corino', s: 'Corpo: Mel / Tecido: Boucle ou Corino / Encosto: Laminado Cor Mel', p: 279.20 },
      { c: 'cad', g: 'Cadeira Bella', t: 'Cadeira Bella - Linho', s: 'Corpo: Mel / Tecido: Linho / Encosto: Linho', p: 402.52 },
      { c: 'cad', g: 'Cadeira Bella', t: 'Cadeira Bella - Boucle ou Corino', s: 'Corpo: Mel / Tecido: Boucle ou Corino / Encosto: Boucle ou Corino', p: 425.22 },
      { c: 'mes', g: 'Mesa Cascata', t: 'Mesa Cascata 1,60 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 1635.67 },
      { c: 'mes', g: 'Mesa Cascata', t: 'Mesa Cascata 1,80 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 1716.93 },
      { c: 'mes', g: 'Mesa Cascata', t: 'Mesa Cascata 2,00 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 1975.29 },
      { c: 'mes', g: 'Mesa Cascata', t: 'Mesa Cascata 2,20 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 2331.01 },
      { c: 'mes', g: 'Mesa Cascata', t: 'Mesa Cascata 2,40 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 2488.87 },
      { c: 'mes', g: 'Mesa Cascata', t: 'Mesa Cascata 2,70 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 2829.22 },
      { c: 'mes', g: 'Mesa Fox', t: 'Mesa Fox 1,40 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 1325.04 },
      { c: 'mes', g: 'Mesa Fox', t: 'Mesa Fox 1,60 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 1429.25 },
      { c: 'mes', g: 'Mesa Fox', t: 'Mesa Fox 1,80 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 1529.69 },
      { c: 'mes', g: 'Mesa Fox', t: 'Mesa Fox 2,00 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 1782.99 },
      { c: 'mes', g: 'Mesa Elegância', t: 'Mesa Elegância 1,30x1,30 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 1932.52 },
      { c: 'mes', g: 'Mesa Elegância', t: 'Mesa Elegância 1,40x1,40 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 2080.20 },
      { c: 'mes', g: 'Mesa Elegância', t: 'Mesa Elegância 1,50x1,50 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 2143.29 },
      { c: 'mes', g: 'Mesa Elegância', t: 'Mesa Elegância 1,60x1,60 Laminada ou Vidro', s: 'Cor da Base: Mel / Cor do Tampo Cinamomo ou Vidro OFF / Canto: Copo', p: 2418.78 }
    ];

    var curCat = 'all';
    var cart = {}; // { idx: { qty, disc } }

    function fmt(v) { return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

    function setCat(cat, el) {
      curCat = cat;
      var tabs = document.querySelectorAll('.tab');
      for(var i=0; i<tabs.length; i++) tabs[i].classList.remove('active');
      el.classList.add('active');
      render();
    }

    function add(idx) {
      if(!cart[idx]) {
        var discInput = document.getElementById('disc-' + idx);
        var discVal = discInput ? parseFloat(discInput.value) || 0 : 0;
        cart[idx] = { qty: 1, disc: discVal };
      } else {
        cart[idx].qty += 1;
      }
      
      var btn = document.getElementById('btn-' + idx);
      if(btn) {
        btn.className = 'btn-add active';
        btn.innerText = 'Adicionado (' + cart[idx].qty + 'x)';
      }
      updCart();
    }

    // Função para ZERAR/LIMPAR o item por completo
    function clearItem(idx) {
      delete cart[idx];
      var input = document.getElementById('disc-' + idx);
      if(input) input.value = '';

      var btn = document.getElementById('btn-' + idx);
      if(btn) {
        btn.className = 'btn-add';
        btn.innerText = '+ Adicionar';
      }

      updateCardPrices(idx, 0);
      updCart();
    }

    function onDiscInput(idx, el) {
      var raw = el.value;
      
      if(raw === '') {
        if(cart[idx]) cart[idx].disc = 0;
        updateCardPrices(idx, 0);
        updCart();
        return;
      }

      var val = parseFloat(raw);
      if(isNaN(val)) return;

      if(val > 10) {
        val = 10;
        el.value = 10;
      } else if(val < 0) {
        val = 0;
        el.value = 0;
      }

      if(cart[idx]) {
        cart[idx].disc = val;
      }
      
      updateCardPrices(idx, val);
      updCart();
    }

    function updateCardPrices(idx, disc) {
      var pOrig = items[idx].p;
      var pFinal = pOrig * (1 - disc / 100);
      
      var origEl = document.getElementById('porig-' + idx);
      var finalEl = document.getElementById('pfinal-' + idx);
      
      if(finalEl) finalEl.innerText = fmt(pFinal);
      if(origEl) {
        if(disc > 0) {
          origEl.innerText = fmt(pOrig);
          origEl.style.display = 'block';
        } else {
          origEl.style.display = 'none';
        }
      }
    }

    function updCart() {
      var cnt = 0, tot = 0;
      for(var k in cart) {
        var qty = cart[k].qty;
        var disc = cart[k].disc || 0;
        var pFinal = items[k].p * (1 - disc / 100);
        cnt += qty;
        tot += qty * pFinal;
      }
      document.getElementById('cnt').innerText = cnt + (cnt === 1 ? ' item selecionado' : ' itens selecionados');
      document.getElementById('tot').innerText = fmt(tot);
    }

    function render() {
      var q = document.getElementById('src').value.toLowerCase();
      var app = document.getElementById('app');
      var html = '';
      var currentGroup = '';

      for(var i = 0; i < items.length; i++) {
        var item = items[i];
        if(curCat !== 'all' && item.c !== curCat) continue;
        if(q && item.t.toLowerCase().indexOf(q) === -1 && item.s.toLowerCase().indexOf(q) === -1 && item.g.toLowerCase().indexOf(q) === -1) continue;

        if(item.g !== currentGroup) {
          currentGroup = item.g;
          html += '<div class="group-title">' + currentGroup + '</div>';
        }

        var inCart = cart[i];
        var qty = inCart ? inCart.qty : 0;
        var disc = inCart ? inCart.disc : 0;
        
        var pFinal = item.p * (1 - (disc / 100));
        var hasDisc = disc > 0;
        var btnClass = qty > 0 ? 'btn-add active' : 'btn-add';
        var btnTxt = qty > 0 ? 'Adicionado (' + qty + 'x)' : '+ Adicionar';

        html += '<div class="card">' +
          '<div class="card-main">' +
            '<div class="info">' +
              '<div class="title">' + item.t + '</div>' +
              '<div class="spec">' + item.s + '</div>' +
            '</div>' +
            '<div class="price-box">' +
              '<div class="price-orig" id="porig-' + i + '" style="display:' + (hasDisc ? 'block' : 'none') + '">' + fmt(item.p) + '</div>' +
              '<div class="price-final" id="pfinal-' + i + '">' + fmt(pFinal) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="controls">' +
            '<div class="disc-group">' +
              '<span>Desc (0-10%):</span>' +
              '<input type="number" id="disc-' + i + '" class="disc-input" min="0" max="10" step="1" value="' + (disc || '') + '" placeholder="0" oninput="onDiscInput(' + i + ', this)">%' +
              '<button class="btn-clear" onclick="clearItem(' + i + ')" title="Zerar item">🗑️ Limpar</button>' +
            '</div>' +
            '<button id="btn-' + i + '" class="' + btnClass + '" onclick="add(' + i + ')">' + btnTxt + '</button>' +
          '</div>' +
        '</div>';
      }

      app.innerHTML = html || '<div style="text-align:center; padding:30px; color:#94a3b8;">Nenhum item encontrado.</div>';
    }

    function send() {
      var msg = '*Orçamento - Nina Decor*\n\n';
      var tot = 0, has = false;
      
      for(var k in cart) {
        has = true;
        var qty = cart[k].qty;
        var disc = cart[k].disc || 0;
        var pOrig = items[k].p;
        var pFinal = pOrig * (1 - disc / 100);
        var sub = qty * pFinal;
        tot += sub;

        msg += '• *' + qty + 'x ' + items[k].t + '*\n';
        if(disc > 0) {
          msg += '  De: ' + fmt(pOrig) + ' por: *' + fmt(pFinal) + '* (-' + disc + '% desc.)\n';
        } else {
          msg += '  Valor unitário: ' + fmt(pOrig) + '\n';
        }
        msg += '  Subtotal: *' + fmt(sub) + '*\n\n';
      }

      if(!has) { alert('Selecione ao menos um produto para o orçamento.'); return; }
      msg += '*Total do Orçamento: ' + fmt(tot) + '*';
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
    }

    render();
  </script>
</body>
</html>
